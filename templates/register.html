{% extends "base.html" %}

{% block title %}Registrieren – Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card">

    <h2>Konto erstellen</h2>
    <p class="muted">Wir schicken dir einen Link, um deine E-Mail-Adresse zu bestätigen.</p>

    <form method="POST" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="username">Benutzername</label>
        <input type="text" id="username" name="username"
               value="{{ user_name or '' }}" maxlength="20"
               autocomplete="username" required autofocus>
      </div>

      <div class="field">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email"
               placeholder="du@beispiel.de"
               autocomplete="email" required>
      </div>

      <button type="submit" class="btn btn-block">Konto erstellen</button>
    </form>

    <div class="form-foot">
      Schon ein Konto? <a href="/login">Anmelden</a>
    </div>

  </div>
</div>
{% endblock %}
