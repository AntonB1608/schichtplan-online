{% extends "base.html" %}

{% block title %}Passwort zurücksetzen – Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card">

    <h2>Passwort zurücksetzen</h2>
    <p class="muted">Gib deine E-Mail-Adresse ein, und wir schicken dir einen Link.</p>

    <form method="POST" action="/reset">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="mail">E-Mail</label>
        <input type="email" id="mail" name="mail"
               placeholder="du@beispiel.de"
               autocomplete="email" required autofocus>
      </div>

      <button type="submit" class="btn btn-block">Link schicken</button>
    </form>

    <div class="form-foot">
      <a href="/login">Zurück zur Anmeldung</a>
    </div>

  </div>
</div>
{% endblock %}
