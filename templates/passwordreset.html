{% extends "base.html" %}

{% block title %}Set a new password — Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card">

    <h2>Set a new password</h2>
    <p class="muted">Min. 15 characters, including one special character.</p>

    {% if error_message %}
      <div class="alert alert-error">{{ error_message }}</div>
    {% endif %}

    <form method="POST" action="/reset/{{ token }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password"
               autocomplete="new-password" required autofocus>
      </div>

      <div class="field">
        <label for="password_again">Repeat password</label>
        <input type="password" id="password_again" name="password_again"
               autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-block">Save password</button>
    </form>

    <div class="form-foot">
      <a href="/login">Back to log in</a>
    </div>

  </div>
</div>
{% endblock %}
