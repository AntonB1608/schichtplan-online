<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shiftmates{% endblock %}</title>
    <meta name="description" content="{% block description %}Email reminders for your work shifts, with the weather for your city.{% endblock %}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
 
    <div class="navbar-wrap">
        <nav class="navbar">
            <div class="navbar-logo">
                <a href="/">Shiftmates</a>
            </div>
 
            <div class="navbar-links">
                {% if session.user_id %}
                    <a href="/index">Add shift</a>
                    <a href="/shifts">Shifts</a>
                    <a href="/profile">Profile</a>
                    <a href="/logout">Log out</a>
                {% else %}
                    <a href="/login">Log in</a>
                    <a href="/register">Sign up</a>
                {% endif %}
            </div>
        </nav>
    </div>
 
    <main class="page">
        {% block content %}{% endblock %}
    </main>
