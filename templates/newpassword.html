{% extends "base.html" %}

{% block title %}Neues Passwort – Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card">

    <h2>Neues Passwort festlegen</h2>
    <p class="muted">Nimm eins, das du noch nirgendwo sonst benutzt hast.</p>

    <form method="POST" action="/reset/{{ token }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="password">Neues Passwort</label>
        <input type="password" id="password" name="password"
               autocomplete="new-password" required>
        <p class="field-hint">Mindestens 8 Zeichen, davon ein Sonderzeichen.</p>
      </div>

      <div class="field">
        <label for="password_again">Neues Passwort wiederholen</label>
        <input type="password" id="password_again" name="password_again"
               autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-block">Neues Passwort speichern</button>
    </form>

    <div class="form-foot">
      <p><a href="/login">Zurück zur Anmeldung</a></p>
    </div>

  </div>
</div>
{% endblock %}
