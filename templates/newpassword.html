{% extends "base.html" %}

{% block title %}Set a new password — Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card">

    <h2>Set a new password</h2>
    <p class="muted">Choose something you have never used elsewhere.</p>

    <form method="POST" action="/reset/{{ token }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password"
               autocomplete="new-password" required>
        <p class="field-hint">Min. 8 characters, including one special character.</p>
      </div>

      <div class="field">
        <label for="password_again">Repeat new password</label>
        <input type="password" id="password_again" name="password_again"
               autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-block">Save new password</button>
    </form>

    <div class="form-foot">
      <p><a href="/login">Back to log in</a></p>
    </div>

  </div>
</div>
{% endblock %}
