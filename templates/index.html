{% extends "base.html" %}

{% block title %}Add shift — Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card">

    <h2>Add a shift</h2>
    <p class="muted">Pick a date, choose a shift type, and add a note if you need one.</p>

    <form method="POST" action="/index">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="datum">Date</label>
        <input type="date" id="datum" name="datum" required>
      </div>

      <div class="field">
        <label for="shift_type">Shift type</label>
        <select id="shift_type" name="shift_type" required>
          {% for value, label in SHIFT_TYPES.items() %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
          <option value="custom">Own name…</option>
        </select>
      </div>

      <div class="field" id="custom-field" hidden>
        <label for="shift_type_custom">Name of your shift type</label>
        <input type="text" id="shift_type_custom" name="shift_type_custom"
               placeholder="Split shift" maxlength="30">
      </div>

      <div class="field-row" id="times">
        <div class="field">
          <label for="zeit_anfang">Starts</label>
          <input type="time" id="zeit_anfang" name="zeit_anfang" required>
        </div>
        <div class="field">
          <label for="zeit_ende">Ends</label>
          <input type="time" id="zeit_ende" name="zeit_ende" required>
        </div>
      </div>

      <div class="field">
        <label for="note">Note <span class="label-hint">optional</span></label>
        <textarea id="note" name="note" rows="2" maxlength="200"
                  placeholder="Handover at the gate"></textarea>
      </div>

      <button type="submit" class="btn btn-block">Save shift</button>
    </form>

    <div class="form-foot">
      <a href="/shifts">See all your shifts</a>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    var type   = document.getElementById('shift_type');
    var custom = document.getElementById('custom-field');
    var name   = document.getElementById('shift_type_custom');
    var times  = document.getElementById('times');

    function sync() {
      var isOff    = type.value === 'off';
      var isCustom = type.value === 'custom';

      custom.hidden = !isCustom;
      name.required = isCustom;

      times.hidden = isOff;
      times.querySelectorAll('input').forEach(function (el) {
        el.required = !isOff;
        if (isOff) { el.value = ''; }
      });
    }

    type.addEventListener('change', sync);
    sync();
  })();
</script>
{% endblock %}
