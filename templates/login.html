{% extends "base.html" %}
 
{% block title %}Log in — Shiftmates{% endblock %}
 
{% block content %}
<div class="wrap">
  <div class="form-card">
 
    <h2>Log in</h2>
    <p class="muted">Your shifts are waiting.</p>
 
    {% if error_message %}
      <div class="alert alert-error">{{ error_message }}</div>
    {% endif %}
 
    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               value="{{ username or '' }}" autocomplete="username" required autofocus>
      </div>
 
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>
      </div>
 
      <button type="submit" class="btn btn-block">Log in</button>
    </form>
 
    <div class="form-foot">
      <a href="/reset">Forgot your password?</a><br>
      No account yet? <a href="/register">Sign up</a>
    </div>
 
  </div>
</div>
{% endblock %}
