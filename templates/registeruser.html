{% extends "base.html" %}

{% block title %}Passwort festlegen – Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card">

    <h2>Passwort festlegen</h2>
    <p class="muted">Mindestens 8 Zeichen, davon ein Sonderzeichen.</p>

    <form method="POST" action="/registeruser">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password"
               autocomplete="new-password" required autofocus>
      </div>

      <div class="field">
        <label for="password_again">Passwort wiederholen</label>
        <input type="password" id="password_again" name="password_again"
               autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-block">Passwort speichern</button>
    </form>

  </div>
</div>
{% endblock %}
