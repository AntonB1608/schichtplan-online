{% extends "base.html" %}

{% block title %}Set your password — Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card">

    <h2>Set your password</h2>
    <p class="muted">Min. 8 characters, including one special character.</p>

    {% if error_message %}
      <div class="alert alert-error">{{ error_message }}</div>
    {% endif %}

    <form method="POST" action="{% if token %}/reset/{{ token }}{% else %}/registeruser{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="new-password" required autofocus>
      </div>

      <div class="field">
        <label for="password_again">Repeat password</label>
        <input type="password" id="password_again" name="password_again"
               autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-block">Save password</button>
    </form>

  </div>
</div>
{% endblock %}
