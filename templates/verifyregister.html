{% extends "base.html" %}

{% block title %}Check your email — Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card center">

    <h2>Check your email</h2>
    <p class="muted">
      We sent you a confirmation link. Open it to verify your address
      and set your password.
    </p>
    <p class="muted">Nothing there? Look in your spam folder.</p>

    <div class="form-foot">
      <a href="/login">Back to log in</a>
    </div>

  </div>
</div>
{% endblock %}
