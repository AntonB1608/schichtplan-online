{% extends "base.html" %}

{% block title %}Profile — Shiftmates{% endblock %}

{% block content %}
<div class="wrap">
  <div class="form-card">

    <h2>Your profile</h2>
    <p class="muted">Where you work, and when your reminders arrive.</p>

    {% if error_message %}
      <div class="alert alert-error">{{ error_message }}</div>
    {% endif %}
    {% if good_message %}
      <div class="alert alert-success">{{ good_message }}</div>
    {% endif %}

    <form method="POST" action="/profile">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="city">City</label>
        <input type="text" id="city" name="city"
               placeholder="Ludwigshafen"
               value="{{ user.user_city or '' if user else '' }}" required autofocus>
      </div>
      <div class="field">
        <label for="email_time_evening">Evening reminder — the night before your shift</label>
        <input type="time" id="email_time_evening" name="email_time_evening"
                placeholder="Reminder for the next day"
                value="{{ user.email_time_evening or '' if user else '' }}" required>
      </div>
      <div class="field">
        <label for="email_time_morning"> Morning reminder — on the day itself</label>
        <input type="time" id="email_time_morning" name="email_time_morning"
                placeholder="Reminder for the same day"
                value="{{ user.email_time_morning or '' if user else '' }}" required>
      </div>
      
      <button type="submit" class="btn btn-block">Save profile</button>
    </form>

    <div class="form-foot">
      <a href="/index">Add a shift</a>
    </div>

  </div>
</div>
{% endblock %}
